name: Exercise Windows bootstrapper outcomes
on:
  push:
    branches: [verify/windows-webview2-bootstrapper]
permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onetagger-windows-x64
          run-id: '44463164119'
          github-token: ${{ github.token }}
          path: reference
          digest-mismatch: error
      - name: Use the same verified native executables for the comparison
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw reference/release-manifest-windows-x64.json | ConvertFrom-Json
          if ($manifest.source_commit -ne '68eed6b04c4a80fa539db795211da1b95a49a480' -or
              $manifest.run_id -ne '44463164119') { throw 'Unexpected source build' }
          foreach ($name in @('OneTagger-windows.exe', 'OneTagger-windows-cli.exe', 'OneTagger-windows-setup.exe')) {
              if ((Get-FileHash "reference/$name").Hash -ne $manifest.sha256.$name) { throw "Checksum mismatch: $name" }
          }
          New-Item -ItemType Directory -Force target/release, dist | Out-Null
          Copy-Item reference/OneTagger-windows.exe target/release/onetagger.exe
          Copy-Item reference/OneTagger-windows-cli.exe target/release/onetagger-cli.exe
          Copy-Item reference/OneTagger-windows.exe, reference/OneTagger-windows-cli.exe dist/
          python ci/check_windows_imports.py target/release/onetagger.exe target/release/onetagger-cli.exe
      - name: Simulate absent WebView2 Runtime and bootstrapper failure
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $version = (Get-Content -Raw VERSION).Trim()
          $realKey = 'SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $fixtureKey = "SOFTWARE\OneTaggerCI\WebView2-$env:GITHUB_RUN_ID"
          $registryPath = 'HKLM:\SOFTWARE\WOW6432Node\' + $fixtureKey.Substring(9)
          if (Test-Path $registryPath) { throw 'The isolated runtime fixture must start absent' }
          $script = Get-Content -Raw assets/installer.nsi
          if (-not $script.Contains($realKey)) { throw 'Runtime detector moved' }
          $script.Replace($realKey, $fixtureKey) | Set-Content assets/fixture-installer.nsi

          function Build-FixtureInstaller($sectionAction) {
              @"
          Name "Synthetic WebView2 bootstrapper"
          OutFile "MicrosoftEdgeWebview2Setup.exe"
          RequestExecutionLevel admin
          SilentInstall silent
          Section
              SetRegView 32
              $sectionAction
          SectionEnd
          "@ | Set-Content fixture-bootstrapper.nsi
              & $nsis fixture-bootstrapper.nsi
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $nsis "/DPRODUCT_VERSION=$version.0" assets/fixture-installer.nsi
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $writeVersion = 'WriteRegStr HKLM "{0}" "pv" "1.2.3.4"' -f $fixtureKey
          Build-FixtureInstaller $writeVersion
          ./ci/smoke_windows_package.ps1 -Dist dist -Version $version
          if ((Get-ItemPropertyValue -Path $registryPath -Name pv) -ne '1.2.3.4') {
              throw 'The installer did not run the required bootstrapper'
          }
          Remove-Item $registryPath -Force
          Write-Output 'Absent-runtime branch invoked bootstrapper and installed successfully'

          Build-FixtureInstaller 'SetErrorLevel 42'
          $directory = Join-Path $env:RUNNER_TEMP "onetagger-bootstrap-failure-$PID"
          $setup = Start-Process -FilePath dist/OneTagger-windows-setup.exe -ArgumentList '/S', "/D=$directory" -Wait -PassThru
          if ($setup.ExitCode -eq 0 -or (Test-Path $directory/onetagger.exe)) {
              throw 'Failed bootstrapper must stop setup before installing the executable'
          }
          Write-Output "Failed bootstrapper blocked installation with exit code $($setup.ExitCode)"
